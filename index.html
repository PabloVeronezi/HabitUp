<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HabitUp</title>

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <h1>HabitUp</h1>
    </header>
    <main>
      <section class="register">
        <h2>Cadastro de Hábito</h2>
        <form id="register-form">
          <label for="add-habit">Hábito</label>
          <input type="text" id="add-habit" placeholder="O que faremos hoje?" />
          <button type="submit">Registrar</button>
        </form>
      </section>
      <section class="habits">
        <h2>Lista de Hábitos</h2>
        <ul>
          <li>Beber água</li>
          <li>Alongar</li>
          <li>Meditar</li>
        </ul>
      </section>
    </main>
  </body>
</html>
